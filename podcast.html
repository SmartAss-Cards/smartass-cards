<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartass Podcast — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=DM+Sans:wght@400;500;600;700&family=Fontdiner+Swanky&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.pod-main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px 64px;min-height:calc(100vh - 64px - 220px)}
.poster{width:100%;max-width:800px}
.poster img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--bdr)}
.pod-eyebrow{margin-bottom:20px}
</style>
</head>
<body>

<header class="site-hdr">
  <a class="site-logo" href="/"><img src="/logo.png" alt="Smartass Support Cards"></a>
  <nav class="desktop-nav" aria-label="Main">
    <a href="/#ecards">eCards</a>
    <a href="/about.html">About</a>
    <a href="/blog.html">Blog</a>
    <a href="/podcast.html">Podcast</a>
    <a href="mailto:sgnandt@gmail.com">Contact</a>
  </nav>
  <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="mobile-menu" id="mobileMenu">
  <button class="mobile-close" onclick="closeMenu()" aria-label="Close menu">✕</button>
  <a href="/#ecards" onclick="closeMenu()">eCards</a>
  <a href="/about.html">About</a>
  <a href="/blog.html">Blog</a>
  <a href="/podcast.html">Podcast</a>
  <a href="mailto:sgnandt@gmail.com">Contact</a>
</div>

<main class="pod-main">
  <div class="section-eyebrow pod-eyebrow">✦ the smartass podcast ✦</div>
  <div class="poster">
    <img src="https://raw.githubusercontent.com/SmartAss-Cards/smartass-cards/main/podcast_comingsoon.png" alt="Smartass Podcast Coming Soon">
  </div>
</main>

<footer>
  <div class="footer-top">
    <div class="footer-brand">
      <img src="/logo.png" alt="Smartass Support Cards">
      <div class="footer-copy">© 2026 Smartass Support Cards</div>
    </div>
    <div class="footer-links">
      <a href="/about.html">About</a>
      <a href="/blog.html">Blog</a>
      <a href="mailto:sgnandt@gmail.com">Contact</a>
      <a href="/podcast.html">SmartAss Podcast</a>
    </div>
    <div class="footer-signup">
      <div class="footer-signup-label">Stay in the loop</div>
      <div class="footer-signup-row">
        <input type="email" class="footer-email" placeholder="your@email.com" aria-label="Email address" onkeydown="if(event.key==='Enter'){event.preventDefault();handleSignup(this.nextElementSibling)}">
        <button class="footer-sub-btn" data-label="Join" onclick="handleSignup(this)">Join</button>
      </div>
    </div>
  </div>
</footer>

<script src="/site.js"></script>
</body>
</html>
